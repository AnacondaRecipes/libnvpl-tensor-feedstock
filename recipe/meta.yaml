{% set version = "0.3.4" %}
{% set soversion = ".".join(version.split(".")[:3]) %}
{% set somajor = version.split(".")[0] %}
{% set arm_variant_type = 'arm_variant_type|default("sbsa")' %}

package:
  name: libnvpl-tensor-split
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/nvpl/redist/nvpl_tensor/linux-sbsa/nvpl_tensor-linux-sbsa-{{ version }}-archive.tar.xz
  sha256: 9ba15be2c01e9bf3a3bca8bd5e64da7a0a86fdc2fd811aaa9108c07bdbbf7e93

build:
  number: 0
  # NVPL targets NVIDIA Grace (linux-aarch64/sbsa) only
  skip: true  # [not (linux and aarch64)]
  script:
    - cp -rv include $PREFIX
    - cp -rv lib $PREFIX
    - check-glibc "$PREFIX"/lib*/*.so.* "$PREFIX"/bin/* "$PREFIX"/targets/*/lib*/*.so.* "$PREFIX"/targets/*/bin/*  # [linux]

requirements:
  build:
    - cf-nvidia-tools 1.*  # [linux]

outputs:
  - name: libnvpl-tensor-dev
    build:
      run_exports:
        - {{ pin_subpackage("libnvpl-tensor" ~ somajor ) }}
    files:
      - include/nvpl_tensor*
      - include/nvpl_tensor*/**
      - lib/cmake/nvpl_tensor*/**
      - lib/libnvpl_tensor*.so
    requirements:
      host:
        - {{ pin_subpackage("libnvpl-tensor" ~ somajor, exact=True) }}
        - _nvpl_dev_mutex
        - libnvpl-common-dev
        - libnvpl-blas-dev
      run:
        - _nvpl_dev_mutex
        - {{ pin_compatible("libnvpl-common-dev", max_pin="x.x.x") }}
        - {{ pin_compatible("libnvpl-blas-dev", max_pin="x.x.x") }}
        - {{ pin_subpackage("libnvpl-tensor" ~ somajor, exact=True) }}
      run_constrained:
        - arm-variant * {{ arm_variant_type }}
    test:
      files:
        - test
      requires:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - cmake
        - ninja-base
      commands:
        - cmake ${CMAKE_ARGS} -GNinja test
        - cmake --build .
        - test -f $PREFIX/include/nvpl_tensor.h
        - test -f $PREFIX/lib/cmake/nvpl_tensor/nvpl_tensor-config.cmake
        - test -f $PREFIX/lib/libnvpl_tensor.so
  - name: libnvpl-tensor{{ somajor }}
    build:
      run_exports:
        - {{ pin_subpackage("libnvpl-tensor" ~ somajor ) }}
    files:
      - lib/libnvpl_tensor*.so.*
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ stdlib("c") }}
        - arm-variant * {{ arm_variant_type }}
        - libgomp
      host:
        - _nvpl_dev_mutex
        - libnvpl-common-dev
        - libnvpl-blas-dev
        # The *_gomp.so variants link the GNU OpenMP runtime directly.
        - libgomp  # [linux]
      run:
        - libgomp  # [linux]
      run_constrained:
        - arm-variant * {{ arm_variant_type }}
    test:
      commands:
        - test -f $PREFIX/lib/libnvpl_tensor.so.{{ somajor }}
        - test -f $PREFIX/lib/libnvpl_tensor.so.{{ soversion }}

about:
  home: https://developer.nvidia.com/nvpl
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_family: Other
  license_file: LICENSE
  license_url: https://docs.nvidia.com/nvpl/latest/license.html
  summary: >-
    The NVIDIA Performance Libraries (NVPL) are a collection of high performance mathematical libraries optimized for the NVIDIA Grace Armv9.0 architecture.
  description: >-
    The NVIDIA Performance Libraries (NVPL) are a collection of high performance mathematical libraries optimized for the NVIDIA Grace Armv9.0 architecture.

    These CPU-only libraries have no dependencies on CUDA or CTK, and are drop in replacements for standard C and Fortran mathematical APIs allowing HPC applications to achieve maximum performance on the Grace platform.
  doc_url: https://docs.nvidia.com/nvpl/
  dev_url: https://developer.nvidia.com/nvpl

extra:
  skip-lints:
    # license_url is kept on all Nvidia feedstocks per team convention
    - deprecate_license_url
    # libgomp + the -dev pin_subpackage host dep are linked/exact but the linter
    # parses the raw recipe; same approach as magma-feedstock.
    - host_section_needs_exact_pinnings
    # runtime output name is jinja-computed; the 1-to-1 anaconda.yaml check
    # compares against the raw (unrendered) name and can't match it.
    - missing_source_tracking
  feedstock-name: libnvpl-tensor
  recipe-maintainers:
    - conda-forge/cuda
